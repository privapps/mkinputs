name: Mac Build 

on:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-go@v2
      with:
        go-version: '^1.23.0'
    - name: build
      shell: bash
      run: |
        uname -a
        go get -d ./...
        bash mac-build.bash
        cd bin
        for i in `ls` ; do tar cJf $i.tar.xz $i ; done
    - uses: actions/checkout@v2
      with:
        ref: dev-bin
        path: dev-bin
    - name: update dev binaries
      shell: bash
      run: |
        cd dev-bin
        cp -f ../bin/*tar.xz .
        git add -A .
        git config --local user.email "privapps"
        git config --local user.name "privapps"
        git commit -m "sync with code $(date +'%F')" && \
        git push "https://${GITHUB_ACTOR}:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:dev-bin || echo