name: Dev CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint (golangci-lint)
        run: |
          if ! ls **/*.go 1>/dev/null 2>&1; then
            echo "No .go files found to lint. Skipping."
            exit 0
          fi
          if [[ -f .golangci.yml ]]; then
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
            golangci-lint run
          else
            echo "No .golangci.yml found, skipping lint"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run tests
        run: go test ./... -v

  build-matrix:
    name: Build (All Platforms)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        goarch: [amd64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Check Go version
        run: go version
      - name: Clean Go module cache
        run: go clean -modcache || true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libpng-dev libxinerama-dev libxrandr-dev libxi-dev libxkbcommon-dev
      - name: Build mkinput
        run: |
          mkdir -p bin
          go build -o bin/mkinput-${{ matrix.os }}-${{ matrix.goarch }} ./cmd/mkinput
          go build -o bin/track-${{ matrix.os }}-${{ matrix.goarch }} ./cmd/track
        env:
          GOARCH: ${{ matrix.goarch }}
      - name: List built binaries
        run: ls -lh bin